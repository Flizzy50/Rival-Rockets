# Render Blueprint. Node's version comes from .node-version.
# Paid plan (user decision, October 2026): rooms live in process memory, and
# free instances spin down when idle, which drops every room. Keep this in
# sync with the dashboard; a Blueprint sync applies this value.
services:
  - type: web
    name: rival-rockets
    runtime: node
    plan: 0.5c-512mb
    # Dev dependencies (Vite, TypeScript) are needed to build the client and server.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Render's proxy appends one X-Forwarded-For entry; per-IP room limits
      # read that one (design M2-9). Verify on deploy: two phones on different
      # networks must get separate create/join budgets.
      - key: RR_TRUSTED_PROXY_HOPS
        value: "1"
      # RR_CONTROL_TEST is deliberately not set here. Set RR_CONTROL_TEST=1 in
      # the Render dashboard only for the M2 device test, then remove it.
